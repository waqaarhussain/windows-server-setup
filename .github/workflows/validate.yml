name: Validate PowerShell package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and check release checksums
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem -Recurse -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          foreach ($property in $manifest.files.PSObject.Properties) {
            if ((Get-FileHash -LiteralPath $property.Name -Algorithm SHA256).Hash -ne $property.Value) {
              throw "Manifest checksum is stale: $($property.Name)"
            }
          }
          $source = Get-Content scripts/Setup-WindowsServer.ps1 -Raw
          $pattern = '(?s)\$xml = @''\r?\n(.*?)\r?\n''@'
          $match = [regex]::Match($source, $pattern)
          if (-not $match.Success) { throw 'Start layout XML missing' }
          [xml]$layout = $match.Groups[1].Value
          if ($source -match 'WinRARLicenseBase64|FromBase64String|RAR registration data') {
            throw 'Embedded licence material must not be committed'
          }
          if (Get-ChildItem -Recurse -Filter rarreg.key) { throw 'Private WinRAR licence found' }
